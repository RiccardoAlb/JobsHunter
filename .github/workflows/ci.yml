name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Il progetto nasce su macOS: Linux non e' ancora provato su una macchina vera, quindi non blocca la CI (Windows invece si'; vedi docs/phase7_status.md).
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    env:
      # I runner di GitHub sono piu' lenti di un PC vero (Windows soprattutto): i limiti di tempo dei test di prestazioni
      # si moltiplicano per questo fattore (vedi t() in tests/conftest.py) invece di allargare i limiti nei test.
      JOBSHUNTER_TEST_TIME_FACTOR: ${{ matrix.os == 'windows-latest' && '3' || matrix.os == 'macos-latest' && '2' || '1' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (in a .venv, like the README says)
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements.txt pytest
      - name: "Tests (no network, the suite forbids it)"
        shell: bash
        run: '"$PY" -m pytest -q -m "not slow"'

  publishable:
    name: Publishable check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: No secrets, personal paths or personal data tracked
        run: python scripts/check_publishable.py
